services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logicodix
      POSTGRES_PASSWORD: logicodix
      POSTGRES_DB: logicodix
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logicodix"]
      interval: 2s
      retries: 15
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logicodix
      POSTGRES_PASSWORD: logicodix
      POSTGRES_DB: logicodix_test
    ports: ["5433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
