services:
  db:
    image: postgres:16-alpine
    environment:
      # Form ${VAR:?pesan} dipilih daripada ${VAR} polos: variabel kosong pada
      # bentuk polos membuat Postgres diam-diam jatuh ke default bawaannya
      # sendiri, bukan gagal start dengan pesan yang menyebut nama variabelnya.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      # Eksplisit meski default-nya sudah prod: deployment ini yang menentukan,
      # bukan default kode, dan pembaca file ini harus melihatnya.
      ENV: prod
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Keduanya wajib, bukan opsional. Tanpa penjaga `:?`, variabel yang tidak
      # diset menjadi string kosong dan container tetap menyala; kegagalannya baru
      # muncul pada percobaan scoring pertama, yaitu di depan juri, sebagai proposal
      # yang menggantung tanpa penjelasan. Lebih baik compose menolak berjalan.
      SCORING_ENGINE: ${SCORING_ENGINE:?set gemini untuk produksi, mock hanya untuk pengembangan}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      # Default, bukan diteruskan kosong: variabel yang tidak diset tapi tetap
      # diteruskan tiba sebagai string kosong dan menimpa default di config.py.
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Keduanya sempat tidak ada di daftar ini sama sekali, dan akibatnya
      # halus justru karena tidak ada yang gagal: .env di server menyetel
      # JWT_TTL_HOURS=12 dan GEMINI_TIMEOUT_S=30, container tidak pernah
      # melihat keduanya, dan produksi diam-diam berjalan dengan default
      # config.py (24 jam dan 60 detik). Token hidup dua kali lebih lama
      # daripada yang dikira operator, dan nilai yang ditulis di .env tidak
      # berarti apa-apa -- bentuk kebohongan konfigurasi yang persis sama
      # dengan yang dicegah penjaga `:?` di atas.
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
      GEMINI_TIMEOUT_S: ${GEMINI_TIMEOUT_S:-60}
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    # NEXT_PUBLIC_API_URL harus masuk sebagai build arg, bukan `environment:`:
    # Next.js meng-inline variabel NEXT_PUBLIC_* ke bundle saat build, dan
    # frontend/lib/api.ts membaca nama ini, bukan NEXT_PUBLIC_API_BASE.
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on: [backend]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [frontend, backend]
    restart: unless-stopped

volumes: { pgdata: {}, caddydata: {} }
