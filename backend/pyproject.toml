[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Tanpa dua baris di bawah, `pip install -e .` gagal dengan "Multiple top-level
# packages discovered in a flat-layout: ['app', 'alembic']": setuptools mencoba
# menebak paketnya dan menemukan dua kandidat di akar. Hanya `app` yang paket;
# `alembic` adalah direktori migrasi dan `tests` tidak ikut dipasang.
[tool.setuptools]
packages = ["app"]

[project]
name = "modalink-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.32", "sqlmodel>=0.0.22",
  "asyncpg>=0.30", "alembic>=1.14", "pydantic-settings>=2.6",
  "argon2-cffi>=23.1", "pyjwt>=2.10",
  "instructor>=1.7", "google-genai>=0.8",
  # EmailStr (schemas/auth.py RegisterIn) butuh paket ini secara eksplisit;
  # Pydantic sendiri hanya mendeklarasikannya sebagai extra opsional, bukan
  # dependency langsung, jadi tanpa baris ini "pip install -e ." tidak
  # menariknya dan EmailStr gagal dengan ImportError saat modul diimpor.
  "email-validator>=2.0",
  # Instructor baru mengimpornya di jalur lazy saat structured output Gemini
  # sungguhan dipanggil (instructor/v2/providers/gemini/utils.py), jadi tanpa
  # ini di sini, pip install biasa tidak menariknya dan GeminiEngine gagal
  # dengan ModuleNotFoundError di tengah pemanggilan, bukan saat instalasi.
  "jsonref>=1.1",
  # SQLAlchemy async (AsyncSession, begin_nested) butuh ini secara eksplisit.
  # Selama ini terpasang sebagai dependency transitif di mesin dev, jadi
  # tidak pernah ketangkap lokal; baru muncul sebagai ModuleNotFoundError
  # saat clean Docker build.
  "greenlet>=3.1",
  # Unggahan multipart (UploadFile di api/v1/covers.py). FastAPI hanya
  # mendeklarasikannya sebagai extra opsional, jadi tanpa baris ini endpoint
  # unggah gagal dengan RuntimeError saat dipanggil, bukan saat instalasi.
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.28", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped loop: the engine is a module-level singleton, and asyncpg
# connections are bound to the loop that opened them. A per-test loop would
# hand back pooled connections tied to an already-closed loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["live: memanggil Gemini sungguhan, di-skip default"]

[tool.ruff]
# Generated by `alembic revision`; not code we hand-maintain.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# FastAPI's `Depends()` in a default argument is the framework's own dependency-
# injection idiom, not a defect.
ignore = ["B008"]

[tool.mypy]
# Without this, mypy treats pydantic-settings fields with no default as
# required constructor arguments, even though they are populated from the
# environment at runtime.
plugins = ["pydantic.mypy"]
