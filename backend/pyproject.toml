[project]
name = "modalink-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.32", "sqlmodel>=0.0.22",
  "asyncpg>=0.30", "alembic>=1.14", "pydantic-settings>=2.6",
  "argon2-cffi>=23.1", "pyjwt>=2.10",
  "instructor>=1.7", "google-genai>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.28", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped loop: the engine is a module-level singleton, and asyncpg
# connections are bound to the loop that opened them. A per-test loop would
# hand back pooled connections tied to an already-closed loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["live: memanggil Gemini sungguhan, di-skip default"]

[tool.ruff]
# Generated by `alembic revision`; not code we hand-maintain.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# FastAPI's `Depends()` in a default argument is the framework's own dependency-
# injection idiom, not a defect.
ignore = ["B008"]
